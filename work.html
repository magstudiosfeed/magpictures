<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work — MAG PICTURES</title>
    <meta name="description" content="Selected work from MAG Pictures." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="work">
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header" id="site-header"></header>
    <div class="mobile-nav" id="mobile-nav" hidden></div>

    <main>
      <section class="page-hero">
        <p class="label reveal">Work</p>
        <h1 class="display display--xl reveal">Stories in motion</h1>
        <p class="lede reveal">Selected frames from recent films, games, and brand worlds.</p>
      </section>

      <section class="section">
        <div class="work-mosaic">
          <figure class="work-mosaic__main reveal" data-cursor="media">
            <img
              src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1600&q=80"
              alt="Abstract cinematic render"
            />
          </figure>
          <figure class="reveal" data-cursor="media">
            <img
              src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?auto=format&fit=crop&w=900&q=80"
              alt="Motion graphics still"
            />
          </figure>
          <figure class="reveal" data-cursor="media">
            <img
              src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?auto=format&fit=crop&w=900&q=80"
              alt="Dark atmospheric scene"
            />
          </figure>
          <figure class="reveal" data-cursor="media">
            <img
              src="https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&w=900&q=80"
              alt="Vivid color study"
            />
          </figure>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
