<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — MAG PICTURES</title>
    <meta name="description" content="Get in touch with MAG Pictures." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="contact">
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header" id="site-header"></header>
    <div class="mobile-nav" id="mobile-nav" hidden></div>
    <main>
      <section class="section contact contact--page">
        <div class="contact__grid">
          <h1 class="display display--xl reveal">Let’s work together</h1>
          <div class="contact__aside">
            <p class="lede reveal">
              New worlds. New characters. New frames that stick. Tell us what
              you’re building.
            </p>
            <a class="text-link reveal" href="mailto:hello@magpicture.com" data-cursor="link">
              Get in touch
              <span class="arrow" aria-hidden="true">→</span>
            </a>
            <p class="contact__meta reveal">
              hello@magpicture.com<br />
              Barcelona
            </p>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
