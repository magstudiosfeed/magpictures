<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team — MAG PICTURES</title>
    <meta name="description" content="Meet the MAG Pictures team." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="team">
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header" id="site-header"></header>
    <div class="mobile-nav" id="mobile-nav" hidden></div>

    <main>
      <section class="page-hero page-hero--row">
        <div>
          <p class="label reveal">The team</p>
          <h1 class="display display--xl reveal">Different backgrounds. Same vision.</h1>
        </div>
        <a class="text-link reveal" href="contact.html" data-cursor="link">
          Get in touch
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </section>

      <section class="section team">
        <div class="team__grid team__grid--3">
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img src="/images/team/modeller.jpg" alt="MAG Pictures modeller" />
            </div>
            <p class="team-card__role">Modeller</p>
          </article>
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img src="/images/team/vfx.jpg" alt="MAG Pictures VFX artist" />
            </div>
            <p class="team-card__role">VFX</p>
          </article>
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img src="/images/team/anim.png" alt="MAG Pictures animator" />
            </div>
            <p class="team-card__role">Animation</p>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
