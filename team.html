<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team — MAG PICTURES</title>
    <meta name="description" content="Meet the MAG Pictures team." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="team">
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header" id="site-header"></header>
    <div class="mobile-nav" id="mobile-nav" hidden></div>

    <main>
      <section class="page-hero page-hero--row">
        <div>
          <p class="label reveal">The team</p>
          <h1 class="display display--xl reveal">Different backgrounds. Same vision.</h1>
        </div>
        <a class="text-link reveal" href="contact.html" data-cursor="link">
          Meet the team
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </section>

      <section class="section team">
        <div class="team__grid">
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img
                src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=700&q=80"
                alt="Portrait of Elias Vorn"
              />
            </div>
            <p class="team-card__role">Creative Director</p>
            <h3>Elias Vorn</h3>
          </article>
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img
                src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=700&q=80"
                alt="Portrait of Mira Sol"
              />
            </div>
            <p class="team-card__role">Animation Lead</p>
            <h3>Mira Sol</h3>
          </article>
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=80"
                alt="Portrait of Kenji Aoki"
              />
            </div>
            <p class="team-card__role">CG Supervisor</p>
            <h3>Kenji Aoki</h3>
          </article>
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80"
                alt="Portrait of Ana Ruiz"
              />
            </div>
            <p class="team-card__role">Look Dev</p>
            <h3>Ana Ruiz</h3>
          </article>
          <article class="team-card reveal" data-cursor="media">
            <div class="team-card__media">
              <img
                src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=700&q=80"
                alt="Portrait of Theo Marsh"
              />
            </div>
            <p class="team-card__role">Compositor</p>
            <h3>Theo Marsh</h3>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
