<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAG PICTURES — 3D Animation & VFX Studio</title>
    <meta
      name="description"
      content="MAG Pictures — a 3D animation and VFX studio crafting stories in motion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="home">
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header" id="site-header"></header>
    <div class="mobile-nav" id="mobile-nav" hidden></div>

    <main>
      <section class="hero">
        <div class="hero__media" data-parallax>
          <img src="/images/hero.jpg" alt="Cinematic character portrait by MAG Pictures" />
          <div class="hero__veil"></div>
        </div>

        <div class="hero__content">
          <h1 class="hero__title">
            <span>MAG PICTURES</span>
            <span class="hero__title-sub"
              >A 3D animation studio for film, games &amp; worlds that feel
              alive.</span
            >
          </h1>
          <a class="text-link" href="work.html" data-cursor="link">
            Stories in motion
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>

        <div class="hero__scroll" aria-hidden="true"><span>Scroll</span></div>
      </section>

      <section class="section home-strip">
        <div class="section__rule reveal"></div>
        <div class="home-strip__grid">
          <a class="home-card reveal" href="about.html" data-cursor="link">
            <p class="label">About</p>
            <h2>Different backgrounds. Same vision.</h2>
          </a>
          <a class="home-card reveal" href="expertise.html" data-cursor="link">
            <p class="label">Expertise</p>
            <h2>Full-service 3D &amp; VFX</h2>
          </a>
          <a class="home-card reveal" href="contact.html" data-cursor="link">
            <p class="label">Contact</p>
            <h2>Let’s work together</h2>
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
