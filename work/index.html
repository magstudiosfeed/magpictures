<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAG</title>
    <meta name="description" content="Selected work and clients from MAG Pictures." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="work">
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header" id="site-header"></header>
    <div class="mobile-nav" id="mobile-nav" hidden></div>
    <main>
      <section class="work-banner" data-parallax-band aria-label="Black Phoenix">
        <div class="work-banner__media">
          <img src="/images/posters/black-phoenix.jpg" alt="Black Phoenix" />
        </div>
        <div class="work-banner__veil" aria-hidden="true"></div>
        <div class="work-banner__copy">
          <h1 class="page-title work-banner__title">
            <span>Black</span>
            <span class="page-title__mark">Phoenix</span>
          </h1>
          <p class="label">Coming soon</p>
        </div>
      </section>

      <section class="section section--work">
        <div class="poster-grid" data-poster-grid>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/lol.png" alt="League of Legends" />
            <figcaption>League of Legends</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/halo.jpg" alt="Halo" />
            <figcaption>Halo</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/alien.jpg" alt="Alien" />
            <figcaption>Alien</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/otg.jpg" alt="Off the Grid" />
            <figcaption>Off the Grid</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/monster-mia.png" alt="Monster Mia" />
            <figcaption>Monster Mia</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/pirate-mo.png" alt="Pirate Mo" />
            <figcaption>Pirate Mo</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/prehistoric-planet.jpg" alt="Prehistoric Planet 2" />
            <figcaption>Prehistoric Planet 2</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/atlas.jpg" alt="Atlas" />
            <figcaption>Atlas</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/quantumania.jpg" alt="Quantumania" />
            <figcaption>Quantumania</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/moana.jpeg" alt="Moana" />
            <figcaption>Moana</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/blancanieves.jpg" alt="Blancanieves" />
            <figcaption>Blancanieves</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/see.jpg" alt="See" />
            <figcaption>See</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/bird-box-barcelona.png" alt="Bird Box Barcelona" />
            <figcaption>Bird Box Barcelona</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/young-woman-and-the-sea.jpg" alt="Young Woman and the Sea" />
            <figcaption>Young Woman and the Sea</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/captain-america.png" alt="Captain America: Brave New World" />
            <figcaption>Captain America</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/megalopolis.png" alt="Megalopolis" />
            <figcaption>Megalopolis</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/carry-on.jpg" alt="Carry-On" />
            <figcaption>Carry-On</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/der-tiger.jpg" alt="Der Tiger" />
            <figcaption>Der Tiger</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/outlander.jpg" alt="Outlander: Blood of My Blood" />
            <figcaption>Outlander</figcaption>
          </figure>
          <figure class="poster poster--more reveal" data-cursor="media">
            <img src="/images/posters/submerged.png" alt="Submerged" />
            <figcaption>Submerged</figcaption>
          </figure>
        </div>
        <button class="work-more" type="button" data-work-more>
          More work
          <span aria-hidden="true">↓</span>
        </button>
      </section>

      <section class="section clients">
        <div class="section__rule reveal"></div>
        <p class="label reveal">Selected clients</p>
        <ul class="brand-logos brand-logos--clients reveal" aria-label="Client logos">
          <li>
            <img src="/images/clients/netflix.png" alt="Netflix" />
          </li>
          <li>
            <img src="/images/clients/disney.svg" alt="Disney" />
          </li>
          <li>
            <img src="/images/clients/hulu.png" alt="Hulu" />
          </li>
          <li>
            <img src="/images/clients/gunzilla.png" alt="Gunzilla" />
          </li>
          <li>
            <img src="/images/clients/paramount.svg" alt="Paramount" />
          </li>
          <li>
            <img src="/images/clients/marvel.svg" alt="Marvel" />
          </li>
        </ul>
      </section>

      <section class="section collaborators">
        <div class="section__rule reveal"></div>
        <p class="label reveal">Collaborators</p>
        <ul class="brand-logos brand-logos--collabs reveal" aria-label="Collaborators">
          <li>
            <img src="/images/collabs/cubica.png" alt="Cubica VFX" />
          </li>
          <li>
            <img src="/images/collabs/sauvage.png" alt="Sauvage tv" />
          </li>
          <li>
            <img src="/images/collabs/upp.png" alt="UPP" />
          </li>
          <li>
            <img src="/images/collabs/mpc.png" alt="MPC" />
          </li>
          <li>
            <img src="/images/collabs/mrx.png" alt="MRX" />
          </li>
          <li>
            <img src="/images/collabs/skydance.png" alt="Skydance Interactive" />
          </li>
          <li>
            <img src="/images/collabs/el-guiri.png" alt="El Guiri" />
          </li>
          <li>
            <img src="/images/collabs/untold.png" alt="Untold Studios" />
          </li>
        </ul>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
