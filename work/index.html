<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work — MAG PICTURES</title>
    <meta name="description" content="Selected work and clients from MAG Pictures." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body data-page="work">
    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header" id="site-header"></header>
    <div class="mobile-nav" id="mobile-nav" hidden></div>
    <main>
      <section class="page-hero">
        <p class="label reveal">Work</p>
        <h1 class="display display--xl reveal">Stories in motion</h1>
        <p class="lede reveal">Selected frames from recent films, games, and brand worlds.</p>
      </section>

      <section class="section">
        <div class="poster-grid">
          <figure class="poster poster--soon reveal" data-cursor="media">
            <img src="/images/posters/black-phoenix.jpg" alt="Black Phoenix" />
            <div class="poster__soon">
              <p class="poster__soon-label">Coming soon</p>
              <img
                class="poster__title"
                src="/images/posters/black-phoenix-title.png"
                alt="Black Phoenix"
              />
            </div>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/lol.png" alt="League of Legends" />
            <figcaption>League of Legends</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/halo.jpg" alt="Halo" />
            <figcaption>Halo</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/alien.jpg" alt="Alien" />
            <figcaption>Alien</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/atlas.jpg" alt="Atlas" />
            <figcaption>Atlas</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/quantumania.jpg" alt="Quantumania" />
            <figcaption>Quantumania</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/moana.jpeg" alt="Moana" />
            <figcaption>Moana</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/blancanieves.jpg" alt="Blancanieves" />
            <figcaption>Blancanieves</figcaption>
          </figure>
          <figure class="poster reveal" data-cursor="media">
            <img src="/images/posters/otg.jpg" alt="OTG" />
            <figcaption>OTG</figcaption>
          </figure>
        </div>
      </section>

      <section class="section clients">
        <div class="section__rule reveal"></div>
        <p class="label reveal">Selected clients</p>
        <ul class="logo-row reveal" aria-label="Client logos">
          <li>Netflix</li>
          <li>Sony</li>
          <li>Pixar</li>
          <li>Ubisoft</li>
          <li>Adobe</li>
          <li>HBO</li>
        </ul>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
